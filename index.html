<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#163d32" />
    <meta name="description" content="LastTray helps local bakeries and grocery shops sell same-day surplus to nearby buyers before it goes to waste." />
    <meta property="og:title" content="LastTray — Good food. Better timing." />
    <meta property="og:description" content="Discover nearby same-day surplus from local bakeries and grocery shops." />
    <meta property="og:type" content="website" />
    <title>LastTray — Good food. Better timing.</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Inline boot styles keep the loading/error screen legible even if style.css fails. */
      html,body{margin:0;min-height:100%;background:#f8f7f1;color:#1e2d27;font-family:Arial,sans-serif}
      .boot-screen{min-height:100vh;display:grid;place-content:center;justify-items:center;text-align:center;padding:24px;box-sizing:border-box;color:#66736b}
      .boot-mark{width:48px;height:48px;border-radius:16px;background:#173f34;display:grid;place-items:center;color:white;font-weight:900;letter-spacing:-1px}
      .boot-screen p{font-size:14px}
      .boot-error{max-width:560px;margin-top:18px;padding:16px 18px;border:1px solid #e2c7a4;border-radius:14px;background:#fff9ef;color:#624a2d;line-height:1.55;text-align:left}
      .boot-error code{background:#f1e5d3;padding:2px 5px;border-radius:4px}
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-screen"><div class="boot-mark">LT</div><p>Setting the tray…</p></div>
    </div>
    <script src="./config.js"></script>
    <script type="module" src="./main.js"></script>
    <script>
      // If the module cannot load, do not leave users staring at an endless splash screen.
      window.setTimeout(() => {
        if (window.__LASTTRAY_APP_READY__) return;
        const app = document.getElementById('app');
        if (!app || !app.querySelector('.boot-screen')) return;
        app.innerHTML = '<div class="boot-screen"><div class="boot-mark">LT</div><h2>LastTray could not start</h2><div class="boot-error"><strong>The website files did not all load.</strong><br><br>Check that <code>index.html</code>, <code>main.js</code>, <code>style.css</code>, and <code>config.js</code> are all in the Vercel project root (the same folder). Then redeploy.\n<br><br>In Vercel, open the deployment and check that <code>/main.js</code> and <code>/style.css</code> both load instead of showing 404.</div></div>';
      }, 8000);
    </script>
  </body>
</html>
